# Miembros del grupo. Aparecen en la web en el mismo orden que aquí
# (por orden alfabético del primer apellido), sin jerarquías.
#
# Cómo añadir a alguien: copia un bloque completo (desde "- nombre:" hasta la
# siguiente línea en blanco), pégalo en su sitio y cambia los datos. Respeta los
# espacios del principio de cada línea.
#
# cargo:       p. ej. "Profesor Titular de Universidad"
# institucion: opcional; si se deja vacío se pone "Universidad de Córdoba".
# orcid:       opcional; si se pone, sus publicaciones aparecen solas en la web.
# inspire:     opcional; enlace a su perfil de INSPIRE, solo si INSPIRE no lo encuentra
#              por el ORCID (p. ej. https://inspirehep.net/authors/2052961).
# completar_con_orcid: true  → añade también lo que esté en ORCID y no en INSPIRE.
# foto:        opcional; sube la foto a estatico/img/miembros/ y pon aquí el nombre del archivo.
# web:         opcional; página personal.
# antiguo: true → pasa a la lista de "Antiguos miembros" (y sus publicaciones dejan de añadirse).
#
# Fuente inicial: web del Departamento de Física (29/10/2026). Fotos: web del
# Departamento y, la de Víctor Miralles, su CV en la Universidad de Alicante.

