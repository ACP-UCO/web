# Miembros del grupo.
#
# Cómo añadir a alguien: copia un bloque completo (desde "- nombre:" hasta la
# siguiente línea en blanco), pégalo y cambia los datos. Respeta los espacios
# del principio de cada línea.
#
# categoria: una de  investigador | postdoc | doctorando | colaborador | antiguo
# orcid:     opcional; si se pone, sus publicaciones aparecen solas en la web.
# inspire:   opcional; enlace a su perfil de INSPIRE, solo si INSPIRE no lo encuentra
#            por el ORCID (p. ej. https://inspirehep.net/authors/2052961).
# completar_con_orcid: true  → añade también lo que esté en ORCID y no en INSPIRE.
# foto:      opcional; sube la foto a estatico/img/miembros/ y pon aquí el nombre del archivo.
# web:       opcional; página personal.
# Fuente inicial: web del Departamento de Física (29/10/2026).

