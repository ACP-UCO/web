# Colaboraciones (experimentales o teóricas) de las que somos miembros.
# En la página «Investigación» se ve solo el logo; al pulsarlo lleva a su web.
# Para añadir una, copia un bloque entero (desde "- nombre:") y cambia los datos.
#
#   nombre: nombre de la colaboración (no se ve, pero lo leen los lectores
#           de pantalla y aparece al pasar el ratón por encima del logo)
#   logo:   archivo de imagen subido a estatico/img/colaboraciones/
#           (mejor cuadrado, PNG o JPG, unos 300×300 píxeles)
#   web:    dirección a la que lleva el logo al pulsarlo

- nombre: COMPACT (Collaboration for Observations, Models and Predictions of Anomalies and Cosmic Topology)
  logo: compact.jpg
  web: https://github.com/CompactCollaboration

- nombre: FCC (Future Circular Collider, CERN)
  logo: fcc.png
  web: https://home.cern/science/accelerators/future-circular-collider
