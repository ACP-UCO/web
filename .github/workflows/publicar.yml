# Construye la web y la publica en lucano.uco.es.
# Se ejecuta: al guardar cambios en main, cada lunes (para refrescar publicaciones)
# y a mano desde la pestaña "Actions" → "Publicar web" → "Run workflow".
#
# Requiere el secreto cifrado del repositorio SFTP_PASSWORD
# (Settings → Secrets and variables → Actions → New repository secret).
#
# Versión en inglés: si algún texto en español es nuevo o ha cambiado, se
# traduce solo con Claude (secreto ANTHROPIC_API_KEY) y la traducción se guarda
# en datos/traducciones.json con un commit automático. Sin ese secreto la web
# se publica igual, pero lo nuevo sale en español también en la versión inglesa.
name: Publicar web

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write   # para guardar las traducciones nuevas en el repositorio

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Descargar publicaciones (INSPIRE / ADS / ORCID)
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python scripts/publicaciones.py

      - name: Construir la web (español e inglés)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/construir.py

      - name: Guardar las traducciones nuevas en el repositorio
        run: |
          if git diff --quiet -- datos/traducciones.json && \
             [ -z "$(git ls-files --others --exclude-standard datos/traducciones.json)" ]; then
            echo "Traducciones al día."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add datos/traducciones.json
          git commit -m "Traducciones al inglés actualizadas automáticamente [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Subir al servidor
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_PASSWORD" ]; then
            echo "::error::Falta el secreto SFTP_PASSWORD en la configuración del repositorio."; exit 1
          fi
          scripts/publicar.sh
